<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mari Jadi Detektif Kata Ganda</title>

https://fonts.googleapis.com
<link href="https://fonts.googleapis.com=Poppins:wght@300;400;600;700;900&display=swap

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
color:white;
overflow-x:hidden;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.hero-content{
max-width:1000px;
}

.hero h1{
font-size:4rem;
color:#facc15;
margin-bottom:20px;
}

.hero p{
font-size:1.3rem;
line-height:1.8;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#f59e0b;
color:black;
text-decoration:none;
font-weight:700;
border-radius:50px;
}

.section{
width:90%;
max-width:1200px;
margin:auto;
margin-bottom:40px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
}

.section h2{
color:#fde047;
margin-bottom:20px;
}

.character-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
margin-top:30px;
}

.character{
text-align:center;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:20px;
}

.character img{
width:250px;
max-width:100%;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.menu{
background:#1e293b;
padding:25px;
border-radius:15px;
text-align:center;
font-weight:bold;
}

footer{
text-align:center;
padding:40px;
background:#020617;
margin-top:50px;
}

@media(max-width:768px){

.hero h1{
font-size:2.5rem;
}

}

</style>

</head>
<body>

<section class="hero">

<div class="hero-content">

<h1>
🕵️‍♂️ MARI JADI DETEKTIF KATA GANDA!
</h1>

<p>
Selamat datang ke Akademi Avengers Bahasa Melayu.
Bersama Spiderman dan Iron Man, murid Tahun 2 akan menyelesaikan misi
misteri Kata Ganda Nama melalui aktiviti yang menyeronokkan.
</p>
